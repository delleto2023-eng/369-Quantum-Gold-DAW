<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>369 Omni Gateway - Big Tony Collective</title>
<style>body{margin:0;font-family:system-ui;background:#0b0905;color:#f5e6b8}h1{color:#ffd54a;text-align:center;text-shadow:0 0 12px #c9a227}.w{max-width:1000px;margin:auto;padding:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.c{border:1px solid #c9a227;border-radius:10px;padding:8px;background:#17120a;display:block}.c small{display:block;color:#c9b27a}
input,select,textarea,button{background:#17120a;color:#ffe9a8;border:1px solid #c9a227;border-radius:8px;padding:8px;margin:3px}button{background:#c9a227;color:#000;font-weight:bold}textarea{width:95%;height:80px}
.out{white-space:pre-wrap;border-left:3px solid #ffd54a;padding:8px;margin:8px 0;background:#120e07}</style></head><body><div class=w>
<h1>369 Omni Gateway<br><small>Big Tony + The Collective · 17 agents</small></h1>
<p>Every agent runs with Big Tony's full skill set. Free fallback: Qwen on Ollama / Noen stuph Sr (via the gateway).</p>
<h3>🔑 Key Broker</h3>Gateway URL <input id=gw size=28 placeholder="http://PC-IP:3690 (optional)"> Token <input id=tk type=password size=10><br>
OpenRouter key <input id=or type=password size=30 placeholder="1 key = all agents"> <button onclick=save()>Save</button><button onclick=exp()>Export to device</button><button onclick=imp()>Import</button>
<h3>🤖 The Collective</h3><div class=g><label class=c><input type=checkbox value="gpt-5" checked><b>GPT 5</b><small>Intelligent chat model</small></label><label class=c><input type=checkbox value="gpt-5.4" checked><b>GPT 5.4</b><small>Flagship model</small></label><label class=c><input type=checkbox value="gpt-5.2" checked><b>GPT 5.2</b><small>Flagship model</small></label><label class=c><input type=checkbox value="gpt-5.1" checked><b>GPT 5.1</b><small>Advanced reasoning</small></label><label class=c><input type=checkbox value="gpt-4o" checked><b>GPT-4o</b><small>Reliable all-purpose</small></label><label class=c><input type=checkbox value="gpt-4o-mini" checked><b>GPT-4o Mini</b><small>Fast and responsive</small></label><label class=c><input type=checkbox value="claude-sonnet-4-6" checked><b>Claude Sonnet 4.6</b><small>Flagship for coding</small></label><label class=c><input type=checkbox value="claude-opus-4-5" checked><b>Claude Opus 4.5</b><small>Claude strongest model</small></label><label class=c><input type=checkbox value="claude-opus-4-1" checked><b>Claude Opus 4.1</b><small>Thoughtful reasoning</small></label><label class=c><input type=checkbox value="gemini-3.1-pro-preview" checked><b>Gemini 3.1 Pro</b><small>Google flagship reasoning</small></label><label class=c><input type=checkbox value="gemini-3-pro-preview" checked><b>Gemini 3 Pro</b><small>Reasoning</small></label><label class=c><input type=checkbox value="gemini-2.5-flash" checked><b>Gemini 2.5 Flash</b><small>Excellent all-rounder</small></label><label class=c><input type=checkbox value="grok-4" checked><b>Grok 4</b><small>Quick real-time knowledge</small></label><label class=c><input type=checkbox value="deepseek-reasoner" checked><b>DeepSeek R1</b><small>Explains its steps clearly</small></label><label class=c><input type=checkbox value="qwen3-max" checked><b>Qwen 3 Max</b><small>Handles long tasks</small></label><label class=c><input type=checkbox value="llama-3.3-70b-versatile" checked><b>Llama 3.3 70B</b><small>Versatile for everyday tasks</small></label><label class=c><input type=checkbox value="kimi-k2-0905-preview" checked><b>Kimi K2</b><small>Great for tough questions</small></label></div>
<h3>💬 Ask</h3><select id=mode><option value=tony>Big Tony picks the best agent</option><option value=all>Collective: all checked agents answer</option></select>
<textarea id=p placeholder="Ask Big Tony or the whole Collective..."></textarea><button onclick=go()>Send</button><div id=o></div>
<p><a style="color:#ffd54a" href="omni-gateway-keys.zip">⬇ Download keys folder + gateway server</a></p></div>
<script>const M=[["gpt-5", "GPT 5", "Intelligent chat model", "openai", "openai/gpt-5"], ["gpt-5.4", "GPT 5.4", "Flagship model", "openai", "openai/gpt-5.4"], ["gpt-5.2", "GPT 5.2", "Flagship model", "openai", "openai/gpt-5.2"], ["gpt-5.1", "GPT 5.1", "Advanced reasoning", "openai", "openai/gpt-5.1"], ["gpt-4o", "GPT-4o", "Reliable all-purpose", "openai", "openai/gpt-4o"], ["gpt-4o-mini", "GPT-4o Mini", "Fast and responsive", "openai", "openai/gpt-4o-mini"], ["claude-sonnet-4-6", "Claude Sonnet 4.6", "Flagship for coding", "anthropic", "anthropic/claude-sonnet-4.6"], ["claude-opus-4-5", "Claude Opus 4.5", "Claude strongest model", "anthropic", "anthropic/claude-opus-4.5"], ["claude-opus-4-1", "Claude Opus 4.1", "Thoughtful reasoning", "anthropic", "anthropic/claude-opus-4.1"], ["gemini-3.1-pro-preview", "Gemini 3.1 Pro", "Google flagship reasoning", "google", "google/gemini-3.1-pro-preview"], ["gemini-3-pro-preview", "Gemini 3 Pro", "Reasoning", "google", "google/gemini-3-pro-preview"], ["gemini-2.5-flash", "Gemini 2.5 Flash", "Excellent all-rounder", "google", "google/gemini-2.5-flash"], ["grok-4", "Grok 4", "Quick real-time knowledge", "xai", "x-ai/grok-4"], ["deepseek-reasoner", "DeepSeek R1", "Explains its steps clearly", "deepseek", "deepseek/deepseek-r1"], ["qwen3-max", "Qwen 3 Max", "Handles long tasks", "qwen", "qwen/qwen3-max"], ["llama-3.3-70b-versatile", "Llama 3.3 70B", "Versatile for everyday tasks", "groq", "meta-llama/llama-3.3-70b-instruct"], ["kimi-k2-0905-preview", "Kimi K2", "Great for tough questions", "moonshot", "moonshotai/kimi-k2"]];const SK="You are Big Tony, the 369 Quantum Gold DAW assistant and leader of the 369 Collective (with Noen stuph Sr, Tony Jr, Mother Eve). Skills: music production and the Gold DAW, 369/Tesla and sacred geometry, astrology and cosmic cycles, 369 money and generational wealth plan, Solomon Library audiobooks, Dev Agents coding, Story Studio, Art Forge, Lyric Lab, AI Employee roles (Social Manager, Lead Catcher, Booker, Listings Keeper), Workflow Review. Be practical, honest and free-first.";
const $=i=>document.getElementById(i);['gw','tk','or'].forEach(k=>$(k).value=localStorage['og_'+k]||'');
function save(){['gw','tk','or'].forEach(k=>localStorage['og_'+k]=$(k).value);alert('Saved on this device only')}
async function kd(pw,s){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',0,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:200000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},0,['encrypt','decrypt'])}
const b64=a=>btoa(String.fromCharCode(...a)),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function exp(){const pw=prompt('Passphrase');if(!pw)return;const s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await kd(pw,s),new TextEncoder().encode(JSON.stringify({gw:$('gw').value,tk:$('tk').value,or:$('or').value}))));
const t='369KEYS:'+b64(s)+'.'+b64(iv)+'.'+b64(c);navigator.clipboard&&navigator.clipboard.writeText(t);prompt('Encrypted key bundle (copied). Paste on your other device:',t)}
async function imp(){const t=prompt('Paste 369KEYS bundle');const pw=prompt('Passphrase');try{const[s,iv,c]=t.slice(8).split('.').map(ub);
const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},await kd(pw,s),c)));for(const k in d)$(k).value=d[k];save()}catch(e){alert('Wrong passphrase or bundle')}}
async function ask(id,p){const m=M.find(x=>x[0]==id),gw=$('gw').value.trim();
const url=gw?gw+'/v1/chat/completions':'https://openrouter.ai/api/v1/chat/completions',key=gw?$('tk').value:$('or').value;
if(!key&&!gw)return'⚠ Add an OpenRouter key or a Gateway URL in the Key Broker.';
const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+key},body:JSON.stringify({model:gw?m[0]:m[4],messages:[{role:'system',content:SK+' You are running as '+m[1]+' ('+m[2]+').'},{role:'user',content:p}]})});
const j=await r.json();return j.choices?j.choices[0].message.content:JSON.stringify(j.error||j)}
function pick(p){const t=p.toLowerCase();if(/code|bug|html|js|python|build/.test(t))return'claude-sonnet-4-6';if(/news|today|latest|trend/.test(t))return'grok-4';if(/long|book|document|summar/.test(t))return'qwen3-max';if(/why|math|prove|step/.test(t))return'deepseek-reasoner';if(/quick|fast/.test(t))return'gemini-2.5-flash';return'gpt-5'}
async function go(){const p=$('p').value;if(!p)return;const ids=$('mode').value=='all'?[...document.querySelectorAll('.c input:checked')].map(i=>i.value):[pick(p)];
for(const id of ids){const d=document.createElement('div');d.className='out';d.textContent=M.find(x=>x[0]==id)[1]+': thinking...';$('o').prepend(d);
ask(id,p).then(a=>d.textContent=M.find(x=>x[0]==id)[1]+':\n'+a).catch(e=>d.textContent=id+' error: '+e)}}
</script></body></html>
