name: Build 369 Quantum Gold installers
on:
  workflow_dispatch:
  push:
    paths: ['app/**','desktop/**']
permissions: {contents: read}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cp -R app desktop/app
      - run: cd desktop && npm install --no-audit --no-fund && npx electron-builder --publish never
        env: {CSC_IDENTITY_AUTO_DISCOVERY: false}
      - uses: actions/upload-artifact@v4
        with:
          name: 369-Quantum-Gold-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
