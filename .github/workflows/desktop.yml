name: Build Golden DAW 369 EXE
on: {workflow_dispatch: {}, push: {branches: [main], paths: ['desktop/**','*.html','omni/**','play/**','databrain/**','jarvis/**','.github/workflows/desktop.yml']}}
permissions: {contents: write}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: delleto2023-eng/369-Chat-Media, path: chatmedia, lfs: false}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Bundle every 369 app and every chat file
        shell: bash
        run: |
          set -e
          A=desktop/app
          mkdir -p $A/omni $A/play $A/library $A/databrain
          cp v351.html v35.html v342.html v343.html v344.html v346.html v347.html v348.html casino45.html $A/
          cp desktop/bigtony.html $A/
          mkdir -p $A/jarvis && cp jarvis/* $A/jarvis/
          cp omni/index.html omni/models.json omni/gateway.mjs omni/Dockerfile omni/fly.toml $A/omni/
          cp databrain/* $A/databrain/
          cp play/*.html $A/play/
          cp -r examples $A/examples
          cp desktop/hub.html $A/index.html
          cd chatmedia
          for z in *.zip; do 7z x -y -o../$A/library "$z" > /dev/null; done
          cd ../$A/library
          for i in 1 2 3; do
            find . -name "*.zip" -type f | while read z; do d="${z%.zip}"; if [ ! -d "$d" ]; then 7z x -y -o"$d" "$z" > /dev/null || true; fi; done
          done
          cd -
          node desktop/manifest.js $A/library
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
        env: {CSC_IDENTITY_AUTO_DISCOVERY: 'false'}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-latest
          name: Golden DAW 369 Omni Suite 4.2 - EVERYTHING + Big Tony Command Center (Windows EXE)
          prerelease: false
          make_latest: true
          body: "Golden-DAW-369-Omni-Suite-4.2.0.zip: unzip and run Golden DAW 369.exe. New: JARVIS tab and Big Tony Command Center tab (Metatron AI, Omni 17, Dev Agent and AI Tool clones, Debate Arena, TabPFN Data Brain, Fly.io deploy). Plus every app, version, photo, video, audio clip and file from the chat."
          files: |
            desktop/dist/Golden-DAW-369-Omni-Suite-4.2.0.zip
